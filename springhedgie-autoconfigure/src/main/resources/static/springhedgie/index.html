<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SpringHedgie &mdash; MCP Tools</title>
<style>
	:root {
		--springhedgie-purple: #6b3fa0;
		--springhedgie-purple-dark: #4a2a70;
		--springhedgie-bg: #f6f4fb;
	}
	body {
		margin: 0;
		font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
		background: var(--springhedgie-bg);
		color: #222;
	}
	header {
		background: var(--springhedgie-purple);
		color: white;
		padding: 18px 32px;
		display: flex;
		align-items: center;
		gap: 14px;
	}
	header .logo { width: 64px; height: 64px; flex-shrink: 0; object-fit: contain; }
	header h1 { margin: 0; font-size: 22px; }
	header .app-name { opacity: 0.9; font-weight: 400; }
	header p { margin: 2px 0 0; opacity: 0.85; font-size: 13px; }
	main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
	.tool-card {
		background: white;
		border: 1px solid #ddd;
		border-left: 4px solid var(--springhedgie-purple);
		border-radius: 6px;
		margin-bottom: 12px;
		overflow: hidden;
	}
	.tool-header {
		padding: 14px 18px;
		cursor: pointer;
		display: flex;
		justify-content: space-between;
		align-items: center;
	}
	.tool-header:hover { background: #faf8fd; }
	.tool-name { font-weight: 600; color: var(--springhedgie-purple-dark); font-family: monospace; }
	.tool-title { font-weight: 600; color: var(--springhedgie-purple-dark); }
	.style-badge {
		font-size: 10px;
		font-weight: 600;
		background: #e8d9ff;
		color: var(--springhedgie-purple-dark);
		padding: 2px 6px;
		border-radius: 10px;
		font-family: monospace;
		margin-left: 6px;
	}
	.hints { margin-top: 4px; }
	.hint-badge {
		display: inline-block;
		font-size: 11px;
		background: #f0eaf9;
		color: #555;
		padding: 2px 6px;
		border-radius: 4px;
		margin-right: 4px;
		font-family: monospace;
	}
	.tool-description { color: #555; font-size: 13px; margin-top: 2px; }
	.tool-body {
		display: none;
		padding: 14px 18px 16px;
		border-top: 1px solid #eee;
	}
	.tool-body.open { display: block; }
	.section-label { font-size: 12px; font-weight: 600; color: #777; text-transform: uppercase; margin: 10px 0 6px; }
	pre {
		background: #2d2440;
		color: #eae4f7;
		padding: 12px;
		border-radius: 4px;
		overflow-x: auto;
		font-size: 12px;
		margin: 0;
	}
	textarea {
		width: 100%;
		box-sizing: border-box;
		font-family: monospace;
		font-size: 12px;
		padding: 10px;
		border-radius: 4px;
		border: 1px solid #ccc;
		min-height: 80px;
		resize: vertical;
	}
	.try-it-btn, .execute-btn {
		background: var(--springhedgie-purple);
		color: white;
		border: none;
		padding: 8px 16px;
		border-radius: 4px;
		cursor: pointer;
		font-size: 13px;
		margin-top: 8px;
	}
	.try-it-btn:hover, .execute-btn:hover { background: var(--springhedgie-purple-dark); }
	.execute-panel { display: none; margin-top: 10px; }
	.execute-panel.open { display: block; }
	.result-box { margin-top: 10px; }
	.result-box.error pre { background: #4a1f1f; color: #f7d9d9; }
	.empty { color: #777; padding: 20px; text-align: center; }
</style>
</head>
<body>
<header>
	<img class="logo" src="logo.svg" alt="SpringHedgie logo">
	<div>
		<h1>SpringHedgie &mdash; <span class="app-name" id="app-name">MCP Tools</span></h1>
		<p>Auto-generated documentation and testing UI for this app's MCP tools</p>
	</div>
</header>
<main id="tools-container">
	<p class="empty">Loading tools&hellip;</p>
</main>
<script>
	fetch("/springhedgie/api/info")
		.then(function (r) { return r.json(); })
		.then(function (info) {
			document.getElementById("app-name").textContent = info.applicationName;
		})
		.catch(function () { /* app name is a nice-to-have, ignore failures */ });

	function exampleFromSchema(schema) {
		var example = {};
		if (!schema || !schema.properties) return example;
		Object.keys(schema.properties).forEach(function (key) {
			var prop = schema.properties[key];
			if (prop.type === "string") example[key] = "";
			else if (prop.type === "number" || prop.type === "integer") example[key] = 0;
			else if (prop.type === "boolean") example[key] = false;
			else example[key] = null;
		});
		return example;
	}

	fetch("/springhedgie/api/tools")
		.then(function (r) { return r.json(); })
		.then(function (tools) {
			var container = document.getElementById("tools-container");
			container.innerHTML = "";
			if (!tools.length) {
				container.innerHTML = '<p class="empty">No @Tool-annotated methods found.</p>';
				return;
			}
			tools.forEach(function (tool) {
				var card = document.createElement("div");
				card.className = "tool-card";
				var titleLine = tool.title ? tool.title + ' <span class="tool-name">(' + tool.name + ')</span>'
					: '<span class="tool-name">' + tool.name + '</span>';
				var hintBadges = Object.keys(tool.hints || {}).map(function (key) {
					return '<span class="hint-badge">' + key.replace("Hint", "") + '=' + tool.hints[key] + '</span>';
				}).join(" ");
				card.innerHTML =
					'<div class="tool-header">' +
						'<div>' +
							'<div class="tool-title">' + titleLine +
								' <span class="style-badge">' + tool.annotationStyle + '</span></div>' +
							'<div class="tool-description">' + (tool.description || "") + '</div>' +
							(hintBadges ? '<div class="hints">' + hintBadges + '</div>' : "") +
						'</div>' +
					'</div>' +
					'<div class="tool-body">' +
						'<div class="section-label">Input schema</div>' +
						'<pre class="schema"></pre>' +
						'<button class="try-it-btn">Try it out</button>' +
						'<div class="execute-panel">' +
							'<div class="section-label">Arguments (JSON)</div>' +
							'<textarea class="args-input"></textarea>' +
							'<div><button class="execute-btn">Execute</button></div>' +
							'<div class="result-box"><div class="section-label">Result</div><pre class="result"></pre></div>' +
						'</div>' +
					'</div>';

				var header = card.querySelector(".tool-header");
				var body = card.querySelector(".tool-body");
				var schemaPre = card.querySelector(".schema");
				var tryItBtn = card.querySelector(".try-it-btn");
				var executePanel = card.querySelector(".execute-panel");
				var argsInput = card.querySelector(".args-input");
				var executeBtn = card.querySelector(".execute-btn");
				var resultBox = card.querySelector(".result-box");
				var resultPre = card.querySelector(".result");

				schemaPre.textContent = JSON.stringify(tool.inputSchema, null, 2);
				argsInput.value = JSON.stringify(exampleFromSchema(tool.inputSchema), null, 2);
				resultBox.style.display = "none";

				header.addEventListener("click", function () {
					body.classList.toggle("open");
				});
				tryItBtn.addEventListener("click", function () {
					executePanel.classList.toggle("open");
				});
				executeBtn.addEventListener("click", function () {
					var args;
					try {
						args = JSON.parse(argsInput.value || "{}");
					}
					catch (e) {
						resultBox.style.display = "block";
						resultBox.className = "result-box error";
						resultPre.textContent = "Invalid JSON: " + e.message;
						return;
					}
					executeBtn.disabled = true;
					executeBtn.textContent = "Running\u2026";
					fetch("/springhedgie/api/tools/" + encodeURIComponent(tool.name) + "/invoke", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify(args)
					})
						.then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
						.then(function (res) {
							resultBox.style.display = "block";
							resultBox.className = res.ok ? "result-box" : "result-box error";
							resultPre.textContent = JSON.stringify(res.data, null, 2);
						})
						.catch(function (err) {
							resultBox.style.display = "block";
							resultBox.className = "result-box error";
							resultPre.textContent = "Request failed: " + err;
						})
						.finally(function () {
							executeBtn.disabled = false;
							executeBtn.textContent = "Execute";
						});
				});

				container.appendChild(card);
			});
		})
		.catch(function (err) {
			document.getElementById("tools-container").innerHTML =
				'<p class="empty">Failed to load tools: ' + err + '</p>';
		});
</script>
</body>
</html>
